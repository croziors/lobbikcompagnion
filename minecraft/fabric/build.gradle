// Mod serveur « lobbik » (27/09/2026) : le réseau Minecraft de Lobbik en Fabric (hub, La Tour, Le Cube) — côté serveur seulement.
plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
base { archivesName = 'lobbik' }
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources { def v = project.version; inputs.property "version", v; filesMatching("fabric.mod.json") { expand "version": v } }
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
