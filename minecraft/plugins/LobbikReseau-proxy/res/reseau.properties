# Réseau Lobbik — réglages du proxy (27/09/2026)
# Serveur d'accueil (le hub « Lobbik ») : les passages par commande y ramènent, la file d'attente s'y fait.
hub=hub
# Places par serveur : valeur de départ seulement — le proxy lit ensuite le max-players de chaque serveur toutes les 5 s.
limites=tour=100,cube=30
# Secondes pendant lesquelles la porte reste ouverte pour le joueur dont c'est le tour.
ouverture=45
# Ports de contrôle locaux (plugin KrpReseau de chaque serveur) et clé partagée.
controle.hub=25580
controle.tour=25581
controle.cube=25582
cle=A_CHANGER
# Noms et couleurs affichés (chat commun, liste des joueurs).
nom.hub=Lobbik
nom.tour=La Tour
nom.cube=Le Cube
couleur.hub=#7CFF4F
couleur.tour=#FFB347
couleur.cube=#5AB4FF
# UUID des admins (séparés par des virgules) : eux seuls gardent /server et /send. Par défaut : croziors (Kripy).
admins=caa13678-f5cd-4801-bbaf-f4fe4bc5924f
